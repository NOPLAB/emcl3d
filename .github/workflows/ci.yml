name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  humble:
    name: ROS 2 Humble build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    env:
      ROS_DISTRO: humble
      ROS_LOCALHOST_ONLY: "1"
      MAKEFLAGS: -j2
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src/mcl3d
          persist-credentials: false

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update --rosdistro "$ROS_DISTRO"
          rosdep install --from-paths src --ignore-src \
            --rosdistro "$ROS_DISTRO" -y

      - name: Build
        run: |
          source /opt/ros/"$ROS_DISTRO"/setup.bash
          colcon build --packages-select mcl3d --executor sequential \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Test
        run: |
          source install/setup.bash
          colcon test --packages-select mcl3d \
            --event-handlers console_direct+ \
            --return-code-on-test-failure

      - name: Report test results
        if: ${{ always() }}
        run: colcon test-result --verbose

      - name: Check installed launch file
        run: |
          source install/setup.bash
          ros2 launch mcl3d mcl3d.launch.xml --show-args
